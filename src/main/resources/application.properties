spring.application.name=shelli-gateway
spring.cloud.config.enabled=false
logging.level.org.springframework.web=INFO
logging.level.org.springframework.context=INFO

# Groq LLM Configuration
groq.api.key=${GROQ_API_KEY}
groq.api.model=openai/gpt-oss-20b

# Auth0 OAuth2 Resource Server
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://dev-fwnv1luqf2t1yke0.us.auth0.com/
spring.security.oauth2.resourceserver.jwt.audiences=https://api.shelli.local

# Allow-list (comma-separated emails, sourced from .env)
shelli.allowed-emails=${SHELLI_ALLOWED_EMAILS:}