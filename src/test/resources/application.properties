# Test-only configuration.
#
# This file SHADOWS src/main/resources/application.properties rather than adding
# to it — only the first application.properties on the classpath is loaded — so
# anything the context needs to start has to be repeated here.
spring.application.name=shelli-gateway
spring.cloud.config.enabled=false

# The main properties read secrets from the environment, and build.gradle only
# loads .env for bootRun — so without these the test context fails to start on
# an unresolvable ${GROQ_API_KEY} placeholder.
groq.api.key=test-key-not-used
groq.api.model=test-model

# jwk-set-uri instead of issuer-uri: issuer-uri makes Spring fetch the OIDC
# discovery document while building the JwtDecoder bean, which would make every
# @SpringBootTest depend on reaching Auth0. jwk-set-uri is fetched lazily on
# first token validation, so the context starts offline.
spring.security.oauth2.resourceserver.jwt.issuer-uri=
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost/.well-known/jwks.json

shelli.allowed-emails=allowed@example.com
